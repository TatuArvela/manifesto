name: Publish server image

# Builds the multi-arch server image on native runners (amd64 on x64, arm64 on
# an arm64 runner) and merges the per-arch images into one manifest. Building
# each arch natively avoids QEMU emulation, which hangs on `pnpm deploy`.
#
# Reused by release.yml for tagged releases, and dispatchable by hand to
# rebuild/republish an image for any ref (recovery, or validating a build).
#
# Each image carries an SBOM and a build provenance attestation: buildx
# attaches both to every platform's image; reading them is shown in
# docs/specification/server/deployment.md.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        type: string
      version:
        description: Image tag to push (e.g. 0.1.2)
        required: true
        type: string
      push_latest:
        description: Also move the :latest tag
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from (branch, tag, or SHA)
        default: main
        type: string
      version:
        description: Image tag to push (e.g. 0.1.1, or ci-test for a throwaway)
        required: true
        type: string
      push_latest:
        description: Also move the :latest tag
        type: boolean
        default: false

permissions: {}

env:
  IMAGE: ghcr.io/tatuarvela/manifesto-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          # Full history: the version counts commits since the last release.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          # Only runs the version script, so nothing to cache, and a cache
          # restored into a job that pushes an image is a poisoning route.
          package-manager-cache: false

      # Resolved out here because the Docker build context excludes `.git`.
      - id: app-version
        run: echo "version=$(node packages/build-version/src/cli.ts)" >> "$GITHUB_OUTPUT"

      - name: Name the platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            MANIFESTO_VERSION=${{ steps.app-version.outputs.version }}
          # An SPDX SBOM of the image and SLSA provenance of how it was
          # built, attached to the image in the registry.
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          # Push each arch as an untagged, digest-only image; the merge job
          # stitches them into the final tag(s).
          outputs: type=image,name=ghcr.io/tatuarvela/manifesto-server,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    environment: image-publish
    permissions:
      packages: write
      # The OIDC token cosign trades for a short-lived signing certificate.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ inputs.version }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          tags=(-t "${IMAGE}:${VERSION}")
          if [ "$PUSH_LATEST" = "true" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      # Signed by digest, never by tag: a tag can be moved to another image
      # afterwards, a digest cannot. Keyless, so the signature names this
      # workflow and there is no key to keep; the entry goes to the public
      # Rekor log. Verifying it is shown in docs/specification/server/deployment.md.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ json .Manifest }}' | jq -r .digest)
          cosign sign --yes "${IMAGE}@${digest}"

      - name: Inspect
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
