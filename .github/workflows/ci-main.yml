name: CI (main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the version in Settings counts commits since the last
          # release, and a shallow clone cannot.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: echo "version=$(ls node_modules/.pnpm/ | grep -E '^playwright@[0-9]' | head -1 | sed 's/playwright@//')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @manifesto/client exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @manifesto/client exec playwright install-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm --filter @manifesto/server build

      # Pages serves this site from https://tatuarvela.github.io/manifesto/,
      # so its assets need that prefix. It is set here rather than defaulted
      # in vite.config.ts, where it applied to every fork's Actions build too.
      - name: Build client (Pages, base /manifesto/)
        env:
          MANIFESTO_BASE_URL: /manifesto/
        run: pnpm --filter @manifesto/client build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/client/dist

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
