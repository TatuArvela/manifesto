name: Workflow audit

# zizmor reads the workflows themselves for the ways a CI run gets taken over:
# untrusted input in `run:`, tokens broader than a job needs, credentials left
# in the checkout, caches a pushing job restores, actions pinned to a tag that
# can be moved. That last one is not theoretical: trivy-action's tags were
# repointed at a credential stealer in 2026. Findings go to code scanning next
# to CodeQL's; CodeQL's `actions` language overlaps, but is narrower.

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    branches: [main]
    paths: [".github/**"]
  # New audits arrive with new zizmor releases, as CodeQL's queries do.
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
