name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The query packs grow between runs, so code nobody touched can still gain
  # a finding. A weekly run catches those without waiting for a push.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` checks the workflows themselves (untrusted input in `run:`,
        # over-broad tokens), which matters since image-publish.yml pushes images.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Neither language needs a build: CodeQL reads TypeScript from source,
      # so there is no pnpm install here.
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Tests stand up loopback servers and open the SSRF seams
          # (`isAllowedAddress`, `allowAnyPort`) on purpose; findings there
          # are noise, not vulnerabilities.
          config: |
            paths-ignore:
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "packages/server/src/test"

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
