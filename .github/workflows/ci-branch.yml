name: CI (branch)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI tests on the Node in .tool-versions and the image ships the one in
      # the Dockerfile, so a green run only vouches for the image if they agree.
      # A Dependabot bump of the base image fails here until .tool-versions
      # gets the same version in the same PR.
      - name: Node version matches the server image
        run: |
          want=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)
          bad=$(grep -E '^FROM node:' packages/server/Dockerfile | grep -v "^FROM node:${want}-alpine" || true)
          if [ -n "$bad" ]; then
            echo "::error file=packages/server/Dockerfile::.tool-versions says nodejs ${want}, but the Dockerfile has: ${bad}"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: playwright-version
        run: echo "version=$(ls node_modules/.pnpm/ | grep -E '^playwright@[0-9]' | head -1 | sed 's/playwright@//')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @manifesto/client exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @manifesto/client exec playwright install-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm --filter @manifesto/server build
      - run: pnpm --filter @manifesto/client build

  # The Dockerfile installs from a partial copy of the workspace, so a change
  # that builds fine here can still break it, and otherwise nothing builds the
  # image until a release. One native arch is enough to catch that; never push.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          push: false
