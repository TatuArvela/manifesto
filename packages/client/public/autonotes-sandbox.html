<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- `worker-src blob:` lets plugins run off the thread of this frame. All
         other sources stay refused. A blob worker inherits this policy. Thus,
         `unsafe-eval` also reaches the worker, where it is necessary, because a
         plugin is evaluated with `new Function`. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; connect-src 'none'"
    />
    <title>Manifesto auto-notes sandbox</title>
  </head>
  <body>
    <script>
      (function () {
        // ---------------------------------------------------------------
        // Plugin evaluation. Stringified into the worker where the frame can
        // create one, and called directly in this frame where it cannot (see
        // `startWorker`). Thus, there is one copy of it in both cases.
        //
        // Nothing here validates the return value of the plugin. A sandbox
        // that a plugin took control of would accept any value. The host
        // validates it, on the other side of `postMessage`.
        // ---------------------------------------------------------------
        function pluginRealm() {
          function bindLocale(raw, locale, approxLabels) {
            const bound = {};
            for (const k of Object.keys(raw)) {
              const fn = raw[k];
              bound[k] = function () {
                const args = Array.prototype.slice.call(arguments);
                if (
                  k === "formatDate" ||
                  k === "formatDateTime" ||
                  k === "relativeDays"
                ) {
                  args.push(locale);
                } else if (k === "approxUntil") {
                  args.push(locale);
                  args.push(approxLabels);
                }
                return fn.apply(null, args);
              };
            }
            return Object.freeze(bound);
          }

          /**
           * Returns one entry for each exported plugin function, exactly as the
           * function returned it. The host flattens and validates.
           */
          return function run(msg, stdlibRaw) {
            const stdlib = bindLocale(stdlibRaw, msg.locale, msg.approxLabels);
            // The notes that the user permitted this plugin to read, frozen: a
            // snapshot to look at, with nothing behind it to write to.
            const notes = (msg.notes || []).map(function (note) {
              return Object.freeze(
                Object.assign({}, note, {
                  tags: Object.freeze((note.tags || []).slice()),
                }),
              );
            });
            const ctx = Object.freeze({
              today: msg.today,
              locale: msg.locale,
              stdlib: stdlib,
              reads: Object.freeze((msg.reads || []).slice()),
              notes: Object.freeze(notes),
            });
            const wrapped =
              "var _exports={};var _default;" +
              "var module={exports:_exports};" +
              "var exports=_exports;" +
              msg.pluginSrc +
              "\n;return (typeof _default!=='undefined')?_default:" +
              "(module.exports&&(module.exports.default||module.exports));";
            const userFn = new Function("ctx", "stdlib", wrapped);
            const exported = userFn(ctx, stdlib);
            const fns = Array.isArray(exported) ? exported : [exported];
            const out = [];
            for (let i = 0; i < fns.length; i++) {
              if (typeof fns[i] !== "function") {
                throw new Error(
                  "plugin default export must be a function or array of functions",
                );
              }
              out.push(fns[i](ctx));
            }
            return out;
          };
        }

        // The message loop of the worker. Also stringified into the worker.
        function workerMain() {
          // The two sources joined before this one define `__stdlibRaw` and
          // `__run`.
          self.onmessage = function (event) {
            const msg = event.data;
            if (!msg || msg.type !== "run") return;
            try {
              // JSON, not a structured clone. A plugin can return functions,
              // getters or cycles, and a DataCloneError thrown inside
              // postMessage would be reported as a fault of the sandbox, not as
              // the own error of the plugin. Wrapped in an object. Thus,
              // `undefined` still stringifies to something.
              const json = JSON.stringify({ value: __run(msg, __stdlibRaw) });
              self.postMessage({ type: "run-ok", id: msg.id, json: json });
            } catch (err) {
              self.postMessage({
                type: "run-err",
                id: msg.id,
                error: err && err.message ? String(err.message) : String(err),
              });
            }
          };
          self.postMessage({ type: "worker-ready" });
        }

        function errorMessage(err) {
          return err && err.message ? String(err.message) : String(err);
        }

        function toParent(msg) {
          window.parent.postMessage(msg, "*");
        }

        let stdlibPrelude = null;
        let stdlibRaw = null;
        let worker = null;
        const run = pluginRealm();

        /**
         * Starts the worker, or reports that it could not. Firefox and older
         * engines refuse a worker in a frame with an opaque origin. Then
         * plugins run on the thread of this frame, as they did before. The host
         * timeout then works only if the plugin yields. That is why the host
         * tells it clearly.
         */
        function startWorker(onReady, onFail) {
          try {
            const source = [
              stdlibPrelude,
              "var __run = (" + pluginRealm.toString() + ")();",
              ";(" + workerMain.toString() + ")();",
            ].join("\n");
            const url = URL.createObjectURL(
              new Blob([source], { type: "text/javascript" }),
            );
            const w = new Worker(url);
            URL.revokeObjectURL(url);
            let booted = false;
            w.onmessage = function (event) {
              const msg = event.data;
              if (!msg) return;
              if (msg.type === "worker-ready") {
                booted = true;
                onReady();
                return;
              }
              // A run result: relay it without change. The host matches it by
              // id.
              toParent(msg);
            };
            w.onerror = function (event) {
              if (!booted) {
                onFail("worker failed to start: " + String(event.message));
                return;
              }
              // An error at the level of the worker has no request id. The
              // timeout of the host is the backstop for a run that never
              // answers.
              toParent({ type: "worker-error", error: String(event.message) });
            };
            worker = w;
          } catch (err) {
            onFail(errorMessage(err));
          }
        }

        function handleInit(msg) {
          try {
            stdlibPrelude = msg.prelude;
            stdlibRaw = new Function(msg.prelude + "\nreturn __stdlibRaw;")();
          } catch (err) {
            toParent({
              type: "init-err",
              id: msg.id,
              error: errorMessage(err),
            });
            return;
          }
          startWorker(
            function () {
              toParent({ type: "init-ok", id: msg.id, mode: "worker" });
            },
            function (error) {
              worker = null;
              toParent({
                type: "init-ok",
                id: msg.id,
                mode: "frame",
                workerError: error,
              });
            },
          );
        }

        function handleRun(msg) {
          if (!stdlibRaw) {
            toParent({
              type: "run-err",
              id: msg.id,
              error: "sandbox not initialized",
            });
            return;
          }
          if (worker) {
            worker.postMessage(msg);
            return;
          }
          try {
            toParent({
              type: "run-ok",
              id: msg.id,
              json: JSON.stringify({ value: run(msg, stdlibRaw) }),
            });
          } catch (err) {
            toParent({
              type: "run-err",
              id: msg.id,
              error: errorMessage(err),
            });
          }
        }

        window.addEventListener("message", function (event) {
          // Accept only messages from our parent window. Without this, each
          // window with a reference to this sandbox could control it.
          if (event.source !== window.parent) return;
          const msg = event.data;
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "init" && typeof msg.prelude === "string") {
            handleInit(msg);
            return;
          }
          if (msg.type === "run" && typeof msg.id === "number") {
            handleRun(msg);
          }
        });

        // Tell the host that the sandbox is ready, through a message that both
        // sides know. The host waits for the iframe `load` and then for this,
        // before it sends `init`.
        if (window.parent && window.parent !== window) {
          toParent({ type: "sandbox-booted" });
        }
      })();
    </script>
  </body>
</html>
