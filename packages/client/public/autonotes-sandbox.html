<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- `worker-src blob:` is what lets plugins run off this frame's thread;
         everything else stays denied. A blob worker inherits this policy, so
         `unsafe-eval` reaches the worker too, which is where it is needed,
         since a plugin is evaluated with `new Function`. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; connect-src 'none'"
    />
    <title>Manifesto auto-notes sandbox</title>
  </head>
  <body>
    <script>
      (function () {
        // ---------------------------------------------------------------
        // Plugin evaluation. Stringified into the worker where one can be
        // created, and called directly in this frame where it cannot (see
        // `startWorker`), so there is one copy of it either way.
        //
        // Nothing here validates the plugin's return value: a sandbox that a
        // plugin has subverted would validate whatever it liked. The host
        // does that, on the far side of `postMessage`.
        // ---------------------------------------------------------------
        function pluginRealm() {
          function bindLocale(raw, locale, approxLabels) {
            const bound = {};
            for (const k of Object.keys(raw)) {
              const fn = raw[k];
              bound[k] = function () {
                const args = Array.prototype.slice.call(arguments);
                if (
                  k === "formatDate" ||
                  k === "formatDateTime" ||
                  k === "relativeDays"
                ) {
                  args.push(locale);
                } else if (k === "approxUntil") {
                  args.push(locale);
                  args.push(approxLabels);
                }
                return fn.apply(null, args);
              };
            }
            return Object.freeze(bound);
          }

          /**
           * Returns one entry per exported plugin function, exactly as the
           * function returned it. The host flattens and validates.
           */
          return function run(msg, stdlibRaw) {
            const stdlib = bindLocale(stdlibRaw, msg.locale, msg.approxLabels);
            const ctx = Object.freeze({
              today: msg.today,
              locale: msg.locale,
              stdlib: stdlib,
            });
            const wrapped =
              "var _exports={};var _default;" +
              "var module={exports:_exports};" +
              "var exports=_exports;" +
              msg.pluginSrc +
              "\n;return (typeof _default!=='undefined')?_default:" +
              "(module.exports&&(module.exports.default||module.exports));";
            const userFn = new Function("ctx", "stdlib", wrapped);
            const exported = userFn(ctx, stdlib);
            const fns = Array.isArray(exported) ? exported : [exported];
            const out = [];
            for (let i = 0; i < fns.length; i++) {
              if (typeof fns[i] !== "function") {
                throw new Error(
                  "plugin default export must be a function or array of functions",
                );
              }
              out.push(fns[i](ctx));
            }
            return out;
          };
        }

        // The worker's message loop. Also stringified into the worker.
        function workerMain() {
          // `__stdlibRaw` and `__run` are defined by the two sources
          // concatenated ahead of this one.
          self.onmessage = function (event) {
            const msg = event.data;
            if (!msg || msg.type !== "run") return;
            try {
              // JSON rather than a structured clone: a plugin can return
              // functions, getters or cycles, and a DataCloneError thrown
              // inside postMessage would be reported as a sandbox fault
              // rather than as the plugin's own mistake. Wrapped in an
              // object so `undefined` still stringifies to something.
              const json = JSON.stringify({ value: __run(msg, __stdlibRaw) });
              self.postMessage({ type: "run-ok", id: msg.id, json: json });
            } catch (err) {
              self.postMessage({
                type: "run-err",
                id: msg.id,
                error: err && err.message ? String(err.message) : String(err),
              });
            }
          };
          self.postMessage({ type: "worker-ready" });
        }

        function errorMessage(err) {
          return err && err.message ? String(err.message) : String(err);
        }

        function toParent(msg) {
          window.parent.postMessage(msg, "*");
        }

        let stdlibPrelude = null;
        let stdlibRaw = null;
        let worker = null;
        const run = pluginRealm();

        /**
         * Starts the worker, or reports that it couldn't. Firefox and older
         * engines refuse a worker in a frame with an opaque origin, in which
         * case plugins run on this frame's thread as they used to, and the host
         * timeout is then only as good as the plugin's willingness to yield,
         * which is why the host says so out loud.
         */
        function startWorker(onReady, onFail) {
          try {
            const source = [
              stdlibPrelude,
              "var __run = (" + pluginRealm.toString() + ")();",
              ";(" + workerMain.toString() + ")();",
            ].join("\n");
            const url = URL.createObjectURL(
              new Blob([source], { type: "text/javascript" }),
            );
            const w = new Worker(url);
            URL.revokeObjectURL(url);
            let booted = false;
            w.onmessage = function (event) {
              const msg = event.data;
              if (!msg) return;
              if (msg.type === "worker-ready") {
                booted = true;
                onReady();
                return;
              }
              // A run result: relay it verbatim. The host correlates by id.
              toParent(msg);
            };
            w.onerror = function (event) {
              if (!booted) {
                onFail("worker failed to start: " + String(event.message));
                return;
              }
              // A worker-level error has no request id, and the host's
              // timeout is the backstop for a run that never answers.
              toParent({ type: "worker-error", error: String(event.message) });
            };
            worker = w;
          } catch (err) {
            onFail(errorMessage(err));
          }
        }

        function handleInit(msg) {
          try {
            stdlibPrelude = msg.prelude;
            stdlibRaw = new Function(msg.prelude + "\nreturn __stdlibRaw;")();
          } catch (err) {
            toParent({
              type: "init-err",
              id: msg.id,
              error: errorMessage(err),
            });
            return;
          }
          startWorker(
            function () {
              toParent({ type: "init-ok", id: msg.id, mode: "worker" });
            },
            function (error) {
              worker = null;
              toParent({
                type: "init-ok",
                id: msg.id,
                mode: "frame",
                workerError: error,
              });
            },
          );
        }

        function handleRun(msg) {
          if (!stdlibRaw) {
            toParent({
              type: "run-err",
              id: msg.id,
              error: "sandbox not initialized",
            });
            return;
          }
          if (worker) {
            worker.postMessage(msg);
            return;
          }
          try {
            toParent({
              type: "run-ok",
              id: msg.id,
              json: JSON.stringify({ value: run(msg, stdlibRaw) }),
            });
          } catch (err) {
            toParent({
              type: "run-err",
              id: msg.id,
              error: errorMessage(err),
            });
          }
        }

        window.addEventListener("message", function (event) {
          // Only honor messages from our parent window. Without this, any
          // window holding a reference to this sandbox could drive it.
          if (event.source !== window.parent) return;
          const msg = event.data;
          if (!msg || typeof msg !== "object") return;
          if (msg.type === "init" && typeof msg.prelude === "string") {
            handleInit(msg);
            return;
          }
          if (msg.type === "run" && typeof msg.id === "number") {
            handleRun(msg);
          }
        });

        // Signal readiness to host via a pre-arranged message. Host waits for
        // iframe `load` and then for this, before sending `init`.
        if (window.parent && window.parent !== window) {
          toParent({ type: "sandbox-booted" });
        }
      })();
    </script>
  </body>
</html>
