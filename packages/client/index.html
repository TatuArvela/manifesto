<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; script-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; manifest-src 'self'" />
    <!-- frame-ancestors cannot be set through a meta tag (CSP3 § 5.4).
         Self-hosters must add `Content-Security-Policy: frame-ancestors 'self'`
         and `X-Frame-Options: SAMEORIGIN` as real HTTP response headers, to
         block clickjacking through cross-origin iframes. -->
    <title>%APP_NAME%</title>
    <!-- To rebrand a prebuilt bundle, change the name here, in <title> above,
         and in manifest.webmanifest. Replace favicon.svg / icon-1024.png /
         logo.svg next to this file. The app reads its name from the tag below
         at startup. Thus, no rebuild is necessary. -->
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <!-- The mark of the app, a file next to this one (inverted in dark mode, so
         a dark shape of a single color works best). The others tell whose copy
         this is, and all are optional: the name ("Foo QA project") and logo of
         this instance, and the organization that owns it and its logo. Those
         two logos are drawn as they are. Each logo can have a `-dark` variant,
         drawn in its place in the dark theme. The logo of the app is then not
         inverted. -->
    <meta name="app-logo" content="%APP_LOGO%" />
    <meta name="app-logo-dark" content="%APP_LOGO_DARK%" />
    <meta name="instance-name" content="%INSTANCE_NAME%" />
    <meta name="instance-logo" content="%INSTANCE_LOGO%" />
    <meta name="instance-logo-dark" content="%INSTANCE_LOGO_DARK%" />
    <!-- "instance" puts the logo and name of the instance in the top bar, in
         place of those of the app, which About still shows. "app" (the default)
         keeps those of the app there. -->
    <meta name="header-brand" content="%HEADER_BRAND%" />
    <!-- "off" gives the tab only the name of the instance as its title, not
         "Foo QA project · Manifesto". Without an instance name, the title is
         the name of the app in both cases. -->
    <meta name="title-app-name" content="%TITLE_APP_NAME%" />
    <meta name="org-name" content="%ORG_NAME%" />
    <meta name="org-logo" content="%ORG_LOGO%" />
    <meta name="org-logo-dark" content="%ORG_LOGO_DARK%" />
    <!-- The location of the privacy notice of this deployment, linked from the
         sign-in screen and About: an https:// address, or a path on this site.
         Each person who runs a server for other people must set it. -->
    <meta name="privacy-url" content="%PRIVACY_URL%" />
    <!-- "on" shows a first-time visitor where their notes are saved. "off"
         skips it. Read at startup, as application-name is. -->
    <meta name="welcome-dialog" content="%APP_WELCOME%" />
    <!-- Connected mode without a rebuild: put the absolute URL of the server
         here, AND add its https:// and wss:// origins to connect-src in the CSP
         above. If not, the browser blocks each request to it. The app checks at
         startup that the two agree, and tells which origins are missing. Thus,
         the login screen does not fail silently. Empty means open mode, with
         notes kept in this browser, which is how the release zip ships. A build
         with VITE_MANIFESTO_SERVER writes the CSP for you, and needs no
         tag. -->
    <meta name="manifesto-server" content="" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />
    <!-- iOS shows an apple-touch-startup-image only for a page that says that
         it runs as an app. src/launchImage.ts draws the images themselves from
         #splash below. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Blocking on purpose. It decides the theme of the page, and all content
         painted before it runs would be painted in the wrong theme. -->
    <script src="/theme-init.js"></script>
    <!-- The loading screen, written here and not in styles.css or a component,
         because both arrive with the bundle, and this must be on the screen
         before the bundle is. When the app starts from a home screen, there is
         no browser chrome to look at while it loads. Thus, the alternative is a
         blank rectangle. main.tsx removes it after the app painted. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #ffffff;
        color: #171717;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      html.dark #splash {
        background: #171717;
        color: #fafafa;
      }
      #splash img {
        width: 76px;
        height: 76px;
      }
      /*
       * The logo of an instance can be wider than it is tall. Thus, it keeps
       * the height and its own shape.
       */
      #splash img[data-wide] {
        width: auto;
        max-width: min(240px, 80vw);
        object-fit: contain;
      }
      /*
       * Inverted in the dark, exactly as the header does to the same file. The
       * mark of the app is a solid black shape. Unchanged, it would be a black
       * mark on a background that is almost black. A logo with a dark variant
       * is replaced by that variant, and is not inverted.
       */
      html.dark #splash img[data-invert] {
        filter: invert(1);
      }
      html.dark #splash img[data-light],
      html:not(.dark) #splash img[data-dark] {
        display: none;
      }
      #splash p {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      /*
       * The name of the instance under the name of the app, as on the sign-in
       * screen.
       */
      #splash p[data-secondary] {
        margin-top: -0.55rem;
        font-size: 0.875rem;
        font-weight: 400;
        color: #525252;
      }
      html.dark #splash p[data-secondary] {
        color: #a3a3a3;
      }
      /*
       * A segment that moves along a track, not a spinner. It tells that the
       * app comes, and does not pretend to know how far it is. Both tones are
       * literal, not `currentColor` at two opacities, because an opacity on the
       * track would also apply to the segment.
       */
      #splash div {
        width: 112px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.1);
      }
      #splash div::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.45);
        animation: splash-sweep 1.15s ease-in-out infinite;
      }
      html.dark #splash div {
        background: rgba(255, 255, 255, 0.14);
      }
      html.dark #splash div::after {
        background: rgba(255, 255, 255, 0.5);
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(280%);
        }
      }
      /* Removed one frame later. Thus, the fade has a start state. */
      #splash[data-done="true"] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash div::after {
          animation: none;
        }
        #splash[data-done="true"] {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body class="bg-white dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100">
    <div id="app"></div>
    <div id="splash" role="status" aria-live="polite">
      <img src="/logo.svg" alt="" data-invert />
      <p>%APP_NAME%</p>
      <div></div>
    </div>
    <!-- Blocking on purpose, as theme-init.js is. It puts in the brand of the
         top bar (that of the instance, or that of the app with the name of the
         instance) before the splash is first drawn. -->
    <script src="/splash-brand.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
