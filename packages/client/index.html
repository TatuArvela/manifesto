<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; script-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; manifest-src 'self'" />
    <!-- frame-ancestors cannot be set via meta tag (CSP3 § 5.4). Self-hosters
         should add `Content-Security-Policy: frame-ancestors 'self'` and
         `X-Frame-Options: SAMEORIGIN` as real HTTP response headers to block
         clickjacking via cross-origin iframes. -->
    <title>%APP_NAME%</title>
    <!-- Rebranding a prebuilt bundle: change the name here, in <title> above,
         and in manifest.webmanifest; swap favicon.svg / icon-1024.png /
         logo.svg beside this file. The app reads its name from the tag below
         at startup, so no rebuild is needed. -->
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <!-- The app's mark, a file beside this one (inverted in dark mode, so a
         dark single-colour shape works best). The rest are who runs this
         copy, all optional: a name for this instance ("Foo QA project"),
         the organisation behind it, and its logo, drawn as it is. -->
    <meta name="app-logo" content="%APP_LOGO%" />
    <meta name="instance-name" content="%INSTANCE_NAME%" />
    <meta name="org-name" content="%ORG_NAME%" />
    <meta name="org-logo" content="%ORG_LOGO%" />
    <!-- "on" greets a first-time visitor with where their notes are saved;
         "off" skips it. Read at startup, like application-name. -->
    <meta name="welcome-dialog" content="%APP_WELCOME%" />
    <!-- Connected mode without a rebuild: put the server's absolute URL here,
         AND add its https:// and wss:// origins to connect-src in the CSP
         above, or the browser blocks every request to it. The app checks the
         two agree at startup and says which origins are missing rather than
         letting the login screen fail in silence. Empty means open mode, with
         notes kept in this browser, which is what the release zip ships as.
         Building with VITE_MANIFESTO_SERVER writes the CSP for you and needs
         no tag. -->
    <meta name="manifesto-server" content="" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Blocking on purpose: it decides the page's theme, and anything painted
         before it runs would be painted in the wrong one. -->
    <script src="/theme-init.js"></script>
    <!-- The loading screen, spelled out here rather than in styles.css or a
         component, because both arrive with the bundle and this has to be on
         screen before the bundle is. Launched from a home screen there is no
         browser chrome to look at while it loads, so the alternative is a
         blank rectangle. main.tsx takes it down once the app has painted. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #ffffff;
        color: #171717;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      html.dark #splash {
        background: #171717;
        color: #fafafa;
      }
      /* Inverted in the dark, exactly as the header does to the same file: the
         brand mark is a solid black shape, and unchanged it would be a black
         mark on a near-black ground. */
      #splash img {
        width: 76px;
        height: 76px;
      }
      html.dark #splash img {
        filter: invert(1);
      }
      #splash p {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      /* A segment sweeping a track rather than a spinner: it says the app is
         coming without pretending to know how far along it is. Both tones are
         literal rather than `currentColor` at two opacities, because opacity
         on the track would take the segment down with it. */
      #splash div {
        width: 112px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.1);
      }
      #splash div::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: rgba(0, 0, 0, 0.45);
        animation: splash-sweep 1.15s ease-in-out infinite;
      }
      html.dark #splash div {
        background: rgba(255, 255, 255, 0.14);
      }
      html.dark #splash div::after {
        background: rgba(255, 255, 255, 0.5);
      }
      @keyframes splash-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(280%);
        }
      }
      /* Removed a frame later, so the fade has something to run from. */
      #splash[data-done="true"] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash div::after {
          animation: none;
        }
        #splash[data-done="true"] {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body class="bg-white dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100">
    <div id="app"></div>
    <div id="splash" role="status" aria-live="polite">
      <img src="/logo.svg" alt="" />
      <p>%APP_NAME%</p>
      <div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
